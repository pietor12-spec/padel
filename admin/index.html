<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pádel Admin</title>
<style>body{margin:0;background:#1f5fbf;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;height:100vh;text-align:center}a{color:#cfee2f}</style></head>
<body><p>La administración se ha mudado a<br><a id="l" href="https://padelurba.github.io/admin/">padelurba.github.io/admin</a></p>
<script>var k=new URLSearchParams(location.search).get("admin");try{k=k||localStorage.getItem("padel-admin")}catch(e){}
var u="https://padelurba.github.io/admin/"+(k?"?admin="+encodeURIComponent(k):"");document.getElementById("l").href=u;location.replace(u);</script></body></html>
