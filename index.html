<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pádel Urba</title>
<meta name="description" content="Reservas de las pistas de pádel de Altos de Valdavia III">
<meta name="theme-color" content="#0d2240">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pádel Urba">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@1,62..125,800..900&display=swap">
<style>
html,body{margin:0;height:100%;background:#0d2240}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
iframe{display:block;border:0;width:100%;height:100%}
#splash{position:fixed;inset:0;z-index:5;background:#1f5fbf;color:#fff;font-family:Archivo,system-ui,sans-serif;text-align:center;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .lg{position:absolute;left:50%;top:50%;width:144px;height:144px;transform:translate(-50%,-50%)}
#splash .tx{position:absolute;left:0;right:0;top:calc(50% + 96px)}
#splash h1{margin:0 0 12px;font-weight:900;font-style:italic;font-stretch:118%;text-transform:uppercase;font-size:2.6rem;letter-spacing:-.01em;line-height:1}
#splash h1 span{color:#cfee2f}
#splash p{margin:0;font-size:.95rem;font-weight:600;opacity:.85;letter-spacing:.04em}
</style>
</head>
<body>
<div id="splash"><svg viewBox="0 0 64 64" class="lg" aria-hidden="true">
        <circle cx="32" cy="32" r="31" fill="#123f86" stroke="#fff" stroke-width="1.5"/>
        <g transform="rotate(-35 32 32)">
          <rect x="29" y="40" width="6" height="17" rx="2.5" fill="#0d2f66" stroke="#fff" stroke-width="1.5"/>
          <path d="M32 6c9.5 0 15 7 15 16.5C47 33 40 41 32 41S17 33 17 22.5C17 13 22.5 6 32 6z" fill="#fff"/>
          <g fill="#123f86">
            <circle cx="27" cy="16" r="1.6"/><circle cx="32" cy="14" r="1.6"/><circle cx="37" cy="16" r="1.6"/>
            <circle cx="24" cy="22" r="1.6"/><circle cx="29.5" cy="21" r="1.6"/><circle cx="34.5" cy="21" r="1.6"/><circle cx="40" cy="22" r="1.6"/>
            <circle cx="26" cy="28" r="1.6"/><circle cx="32" cy="27" r="1.6"/><circle cx="38" cy="28" r="1.6"/>
            <circle cx="29" cy="33.5" r="1.6"/><circle cx="35" cy="33.5" r="1.6"/>
          </g>
        </g>
        <circle cx="47" cy="45" r="8" fill="#cfee2f" stroke="#0d2f66" stroke-width="1.5"/>
        <path d="M40.5 41.5c3.5 1.5 5 5.5 3.5 10M53.5 48.5c-3.5-1.5-5-5.5-3.5-10" fill="none" stroke="#fff" stroke-width="1.4"/>
      </svg><div class="tx"><h1>Pádel <span>Urba</span></h1><p>Altos de Valdavia III</p></div></div>
<iframe id="app" title="Pádel Urba" allow="clipboard-write"></iframe>
<script>
var APP="https://script.google.com/macros/s/AKfycbwMvd-lI5NOr4Jai7kXUjsiniY0q_V_3z_4JmoC4LFVOhPPKWWZOA-Wpg1747S-yGhrzg/exec";
var dev="";
try{dev=localStorage.getItem("padel-dev")||"";}catch(e){}
if(!/^[0-9a-f]{32}$/.test(dev)){var a=new Uint8Array(16);crypto.getRandomValues(a);dev=Array.prototype.map.call(a,function(b){return("0"+b.toString(16)).slice(-2)}).join("");try{localStorage.setItem("padel-dev",dev)}catch(e){}}
var q=new URLSearchParams(location.search),p=new URLSearchParams();
if(q.get("admin"))p.set("admin",q.get("admin"));
p.set("d",dev);
var t0=Date.now(),sp=document.getElementById("splash"),hid=false;
function hide(){if(hid)return;hid=true;setTimeout(function(){sp.className="out";setTimeout(function(){sp.style.display="none"},400)},Math.max(0,900-(Date.now()-t0)))}
document.getElementById("app").addEventListener("load",function(){setTimeout(hide,300)});
setTimeout(hide,15000);
document.getElementById("app").src=APP+"?"+p.toString();
</script>
</body>
</html>
